name: Docs

on:
  pull_request:
    branches: [main]
    paths: ["website/**", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages needs to read the repo Pages site (Source: GitHub Actions).
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: website
      - name: Test website
        run: npm test
        working-directory: website
      # Requires Settings → Pages → Source = GitHub Actions (not a branch deploy).
      - if: github.ref == 'refs/heads/main'
        name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - if: github.ref == 'refs/heads/main'
        name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
